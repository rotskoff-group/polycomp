  - cuda-version>=12.0
  - cupy
  - numpy>=1.26
  - scipy
  - matplotlib-base
  - jax
  - jaxlib
  - pymbar>=4.0
  - pillow
  - celluloid
  - contourpy
  - cycler
  - fonttools
  - kiwisolver
