  - pip:
      - dash
      - dash-core-components
      - dash-html-components
      - dash-table
      - flask
      - imageio
      - nest-asyncio
      - networkx
      - pandas
      - plotly
      - requests
      - retrying
      - scikit-image
      - tenacity
      - tifffile
