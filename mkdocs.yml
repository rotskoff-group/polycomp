site_name: Polycomp
extra_css:
  - stylesheets/extra.css

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
  features:
    - search.suggest
    - search.highlight
    - navigation.instant

# repo_url: https://github.com/mtzgroup/chemcloud-client
# edit_uri: edit/develop/docs/
# site_author: Emmit Pert
#
watch:
  - polycomp  # Path to your Python source code

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_root_heading: False
            show_root_full_path: False
            show_category_heading: True
            show_signature_annotations: True
            signature_crossrefs: true
            show_if_no_docstring: False
            group_by_category: True
            heading_level: 2
            inherited_members: True
            show_root_members_full_path: False
            filters:
              - "!^_"

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - toc:
      permalink: 🔗
  - markdown_include.include:
      base_path: docs

extra_javascript:
  #  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js


nav:
  - Home: 'index.md'
  - Getting Started: 
      - Installation: 'getting_started.md'
      - General Usage: 'general_usage.md'
      - Running Efficiently: 'efficiency.md'
      - Troubleshooting: 'troubleshooting.md'
  - Example Usage: 'examples.md'
  - Conceptual Basis: 'math_overview.md'
  - API Documentation: 
      - Grid: 'grid.md'
      - Integration Schemes: 'integrator.md'
      - Modified Diffusion Equation: 'mde.md'
      - PolySystem Method: 'polymersystem.md'
      - Species Inventory: 'inventory.md'
      - Observables: 'observables.md'
  - Experimental Methods & Helpers:
      - Gibbs Ensemble: 'se_gibbs.md'
      - Shape Utilities: 'shape_utilities.md'
    
