default_language_version:
    python: python3.11

repos:
-   repo: https://github.com/PyCQA/autoflake
    rev: v2.3.1
    hooks:
    -   id: autoflake
        args:
          - --in-place
          - --remove-all-unused-imports
          - --remove-unused-variables

-   repo: https://github.com/psf/black
    rev: 24.4.2  # Use a specific version of black for consistency
    hooks:
    -   id: black


-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

-   repo: https://github.com/pycqa/flake8
    rev: 7.0.0   # Use a specific version of flake8
    hooks:
    -   id: flake8
        args: ['--max-line-length=88'] # <--- ADD THIS LINE

